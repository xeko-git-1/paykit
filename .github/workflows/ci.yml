name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  # Gates the standalone-service cold-start path (migrate → bootstrap → serve →
  # /v1) against a real Postgres. The matrix job above uses mock DBs and cannot
  # catch schema/migration/relational-query regressions; this job can.
  service-cold-start:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paykit
          POSTGRES_PASSWORD: paykit
          POSTGRES_DB: paykit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paykit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PAYKIT_E2E_DATABASE_URL: postgres://paykit:paykit@localhost:5432/paykit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Runs the PAYKIT_E2E_DATABASE_URL-gated e2e (migrate → bootstrap → mint →
      # checkout amountVnd → /v1 auth). Skipped automatically when the var is unset.
      - run: pnpm vitest run packages/service/__tests__/service-cold-start.e2e.test.ts
