name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Version comes from `packageManager` in package.json (pnpm@10.0.0).
          # Passing `version` here as well triggers ERR_PNPM_BAD_PM_VERSION.
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@xeko-git-1"
      - run: pnpm install --frozen-lockfile
      # Build first. Packages in this workspace resolve each other through their
      # `dist` output, which does not exist in a fresh checkout — running
      # typecheck before build fails with TS2307 on sibling packages that are
      # perfectly fine once compiled. `files: ["dist"]` also means an unbuilt
      # tree would publish empty tarballs.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Publish all packages
        run: pnpm -r --filter './packages/*' publish --no-git-checks --access restricted
        env:
          # The project-level .npmrc reads ${GITHUB_TOKEN} and takes precedence
          # over the user-level file setup-node writes, so NODE_AUTH_TOKEN alone
          # left the token unresolved and every publish 401'd. Setting both keeps
          # whichever config wins authenticated.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
