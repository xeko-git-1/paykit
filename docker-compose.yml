# Development docker-compose: service + postgres
# Usage: docker compose up
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paykit
      POSTGRES_PASSWORD: paykit
      POSTGRES_DB: paykit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paykit"]
      interval: 5s
      timeout: 3s
      retries: 5

  service:
    build:
      context: .
      dockerfile: packages/service/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://paykit:paykit@postgres:5432/paykit
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    # Run migrations before serving
    command: ["serve"]

volumes:
  pgdata:
